<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>B站离线舱</title>
<style>
body{font-family:system-ui,Segoe UI,Arial;padding:12px;width:280px;background:#1f1f1f;color:#e0e0e0}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
h3{color:#FB7299;margin:0;font-size:18px;flex:1;text-align:center}
.lang-btn{background:transparent;border:1px solid #444;color:#aaa;padding:2px 6px;border-radius:4px;font-size:11px;cursor:pointer;margin-left:8px;box-shadow:none;width:auto}
.lang-btn:hover{background:#333;color:#fff}
button{width:100%;padding:12px;border:0;border-radius:8px;background:#FB7299;color:#fff;font-weight:600;font-size:14px;cursor:pointer;transition:background 0.2s;box-shadow:0 2px 6px rgba(251,114,153,0.2)}
button:hover{background:#ff85a8}
button:active{transform:scale(0.98)}
#msg{margin-top:8px;font-size:13px;text-align:center;min-height:0;color:#aaa}
.tips{background:#2d2d2d;border-radius:8px;padding:12px;margin-bottom:15px;font-size:12px;color:#bbb;line-height:1.5;border:1px solid #3a3a3a}
.tips p{margin:0 0 6px;color:#fff;font-weight:600;display:flex;align-items:center;gap:4px}
.tips ul{margin:0;padding-left:16px}
.tips li{margin-bottom:4px}
.tips li:last-child{margin-bottom:0}
.footer{margin-top:8px;font-size:12px;color:#888;text-align:center;border-top:1px solid #333;padding-top:10px}
.footer a{color:#FB7299;text-decoration:none}
.footer a:hover{text-decoration:underline}
.foot-tip{margin-bottom:10px;font-size:11px;color:#888;line-height:1.7}
.foot-btn{display:inline-block;padding:5px 20px;border:1px solid rgba(251,114,153,0.6);border-radius:20px;color:#FB7299;font-size:12px;margin-bottom:10px}
.foot-btn:hover{background:rgba(251,114,153,0.12);text-decoration:none;color:#FB7299}
.quality-group{display:flex;gap:8px;margin-bottom:15px}
.quality-opt{flex:1;position:relative;cursor:pointer}
.quality-opt input{position:absolute;opacity:0;width:0;height:0}
.quality-card{background:#2d2d2d;border:1px solid #3a3a3a;border-radius:8px;padding:10px;text-align:center;transition:all 0.2s;height:100%;box-sizing:border-box}
.quality-opt input:checked + .quality-card{background:rgba(251,114,153,0.1);border-color:#FB7299;box-shadow:0 0 0 1px #FB7299}
.quality-title{display:block;color:#fff;font-weight:600;font-size:13px;margin-bottom:2px}
.quality-desc{display:block;color:#888;font-size:11px;line-height:1.3}
.quality-opt input:checked + .quality-card .quality-title{color:#FB7299}
</style>
</head>
<body>
<div class="header">
  <h3 data-i18n="popupTitle">B站离线舱-番剧电影下载器</h3>
  <button id="langToggle" class="lang-btn">EN</button>
</div>
<div class="quality-group">
  <label class="quality-opt">
    <input type="radio" name="video_quality" value="hdr" checked>
    <div class="quality-card">
      <span class="quality-title" data-i18n="lblHdr">HDR / 杜比</span>
      <span class="quality-desc" data-i18n="descHdr">色彩生动 专用</span>
    </div>
  </label>
  <label class="quality-opt">
    <input type="radio" name="video_quality" value="sdr">
    <div class="quality-card">
      <span class="quality-title" data-i18n="lblSdr">SDR (H.265)</span>
      <span class="quality-desc" data-i18n="descSdr">兼容性好 推荐</span>
    </div>
  </label>
</div>
<div class="tips">
  <p data-i18n="tipsTitle">💡 使用小贴士</p>
  <ul>
    <li data-i18n="tipStream"><b>流式保存</b>：针对超大文件（>1.8GB），插件会自动弹出两次保存对话框（分别保存视频/音频），建议都保存到浏览器默认下载文件夹，方便统一管理。请务必保持弹窗与页面开启直至完成。</li>
    <li data-i18n="tipQuality">插件会自动选择当前视频可用的最高画质（如 4K/1080P+），请确保大会员账号已登录。如果您选择了 HDR 但当前视频（或您的账号）不支持，插件会自动降级为您下载最高画质的 SDR 版本。</li>
  </ul>
</div>
<button id="send" data-i18n="btnDownload">一键下载（最高支持8K）</button>
<div id="msg"></div>
<div class="footer">
  <div class="foot-tip" data-i18n="footerFeedback">插件制作不易，如果它确实帮到了你，希望能支持一下，让我有动力持续更新！</div>
  <div><a class="foot-btn" href="https://afdian.com/a/luokexiaoguo" target="_blank" rel="noopener noreferrer" data-i18n="linkSupport">支持</a></div>
  <div style="margin-top:2px"><span data-i18n="footerEmail">反馈邮箱：</span><a href="mailto:luokexiaoguo@foxmail.com">luokexiaoguo@foxmail.com</a></div>
</div>
<script src="popup.js"></script>
</body>
</html>
